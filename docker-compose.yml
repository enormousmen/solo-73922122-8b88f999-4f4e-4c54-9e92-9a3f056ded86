services:
  web:
    build: .
    image: tas-anomaly-service:latest
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      # Deliberately slow, interruptible work so the browser demo can show
      # shared-baseline reuse and interleaved cancellation.
      SLOW_STEP_DELAY: "0.35"
      SLOW_STEPS: "12"
      MAX_ACTIVE_JOBS: "2"
      WORKER_TERM_TIMEOUT: "8"
      # Expose the in-process shutdown trigger for the controllable shutdown
      # demo (POST /admin/shutdown).  `docker compose stop` (SIGTERM) runs the
      # exact same lifespan teardown; the endpoint only helps on hosts whose
      # seccomp policy refuses signal delivery.
      ENABLE_SHUTDOWN_ENDPOINT: "1"
    volumes:
      - tas-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tas-data:
